<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DynoBuild - Create & Play 3D Worlds</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #0f172a; color: #f8fafc; overflow: hidden; }
    
    /* Top Navbar */
    #navbar { height: 54px; background: #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #334155; }
    .brand { font-weight: 900; font-size: 1.3rem; color: #38bdf8; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
    .nav-controls { display: flex; gap: 10px; align-items: center; }
    input, select, button { padding: 7px 12px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: white; font-size: 0.9rem; }
    button { background: #2563eb; border: none; cursor: pointer; font-weight: 600; transition: 0.15s; }
    button:hover { background: #1d4ed8; }
    button.green { background: #16a34a; }
    button.green:hover { background: #15803d; }
    button.danger { background: #dc2626; }
    button.active-tool { outline: 2px solid #38bdf8; background: #0284c7; }

    /* Lobby View */
    #lobby { padding: 30px; max-width: 1100px; margin: 0 auto; height: calc(100vh - 54px); overflow-y: auto; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .game-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; height: 165px; }
    .game-card h3 { font-size: 1.15rem; margin-bottom: 6px; color: #f1f5f9; }
    .game-meta { font-size: 0.85rem; color: #94a3b8; }

    /* 3D Viewport & HUD */
    #viewport-container { display: none; position: relative; width: 100vw; height: calc(100vh - 54px); }
    
    /* Studio Toolbar */
    #studio-toolbar { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.94); padding: 10px 14px; border-radius: 10px; display: none; gap: 8px; align-items: center; border: 1px solid #475569; flex-wrap: wrap; z-index: 10; }
    
    /* Leaderboard (Top Right) */
    #leaderboard { position: absolute; top: 15px; right: 15px; width: 210px; background: rgba(15, 23, 42, 0.82); border: 1px solid #334155; border-radius: 8px; padding: 10px; backdrop-filter: blur(4px); }
    #leaderboard h4 { font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 5px; margin-bottom: 6px; letter-spacing: 0.5px; }
    #player-list { list-style: none; font-size: 0.88rem; display: flex; flex-direction: column; gap: 5px; max-height: 200px; overflow-y: auto; }
    .player-entry { display: flex; align-items: center; gap: 8px; }
    .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    /* Chat Box (Bottom Left) */
    #chat-box { position: absolute; bottom: 15px; left: 15px; width: 330px; background: rgba(15, 23, 42, 0.82); border: 1px solid #334155; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; backdrop-filter: blur(4px); }
    #chat-messages { height: 135px; overflow-y: auto; font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; }
    #hud-hint { position: absolute; top: 15px; left: 15px; background: rgba(15, 23, 42, 0.75); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; color: #cbd5e1; }
  </style>
</head>
<body>
  <div id="navbar">
    <div class="brand">🧱 DYNOBUILD</div>
    <div class="nav-controls">
      <input id="username" placeholder="Username" value="DynoPlayer" style="width:130px" />
      <input id="avatarColor" type="color" value="#3b82f6" title="Avatar Color" style="width:42px; padding:2px; cursor:pointer;" />
      <button onclick="showLobby()">Discover</button>
      <button class="green" onclick="openStudio()">+ DynoStudio</button>
    </div>
  </div>

  <!-- Game Catalog Lobby -->
  <div id="lobby">
    <h2>Popular Worlds on DynoBuild</h2>
    <div class="game-grid" id="game-grid"></div>
  </div>

  <!-- 3D Viewport -->
  <div id="viewport-container">
    <div id="hud-hint">WASD: Move • Space: Jump • Right-Drag: Camera</div>
    
    <!-- Studio Mode Controls -->
    <div id="studio-toolbar">
      <input id="gameTitle" placeholder="World Name..." value="My Dyno World" style="width:140px" />
      <button onclick="studioAddBlock()">+ Part</button>
      <button id="btn-translate" class="active-tool" onclick="setGizmoMode('translate')">Move</button>
      <button id="btn-scale" onclick="setGizmoMode('scale')">Scale</button>
      <button id="btn-rotate" onclick="setGizmoMode('rotate')">Rotate</button>
      <input id="blockColor" type="color" value="#ef4444" onchange="updateSelectedBlock()" style="width:36px; padding:2px;" />
      <select id="blockScript" onchange="updateSelectedBlock()">
        <option value="solid">Script: Solid Part</option>
        <option value="jumppad">Script: Jump Pad</option>
        <option value="speed">Script: Speed Pad</option>
        <option value="checkpoint">Script: Checkpoint</option>
        <option value="kill">Script: Lava / Kill</option>
      </select>
      <button class="danger" onclick="studioDeleteSelected()">Delete</button>
      <button class="green" onclick="publishGame()">Publish</button>
    </div>

    <!-- Server Leaderboard -->
    <div id="leaderboard">
      <h4>Players in Server</h4>
      <ul id="player-list"></ul>
    </div>

    <!-- Multiplayer Chat -->
    <div id="chat-box">
      <div id="chat-messages"></div>
      <input id="chat-input" placeholder="Press Enter to chat..." />
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="engine.js"></script>
</body>
</html>
